name: nucad
channels:
  - conda-forge
dependencies:
  - python == 3.12
  - tqdm
  - jupyterlab
  - ipykernel == 6.30.1
  - joblib
  - numpy
  - scipy
  - pandas
  - pyarrow
  - fastparquet
  - matplotlib
  - cadquery == 2.5.2
  - ocp
  - pip
  - pip:
    - ezdxf>=1.1
    - jupyter-cadquery
    - pycatima
    - nucad
    - tqdm-joblib
